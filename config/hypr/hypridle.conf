# Verrouillage / mise en veille automatiques (hypridle)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Baisse de la luminosité après 2 min 30
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Verrouillage de la session après 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Extinction de l'écran après 5 min 30
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Mise en veille automatique DÉSACTIVÉE (demande de l'utilisateur).
