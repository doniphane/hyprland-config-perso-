# Écran de verrouillage (hyprlock)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/hypr/wall2.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.0
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    inner_color = rgba(17, 17, 27, 0.55)
    outer_color = rgba(51, 204, 255, 1)
    check_color = rgba(166, 227, 161, 1)
    fail_color = rgba(243, 139, 168, 1)
    font_color = rgba(205, 214, 244, 1)
    font_family = $font
    rounding = 14
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Mot de passe…</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 82
    font_family = $font
    color = rgba(205, 214, 244, 1)
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    font_size = 20
    font_family = $font
    color = rgba(166, 173, 200, 1)
    position = 0, 140
    halign = center
    valign = center
}
